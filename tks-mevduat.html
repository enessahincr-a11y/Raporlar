<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TKS · Hisse + Nakit ve Mevduat Karşılaştırması</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("rapor_tema")||"dark";}catch(e){document.documentElement.dataset.theme="dark";}</script>
<style>
:root,:root[data-theme="dark"]{
  --bg:#0e1116; --panel:#161a21; --panel2:#1b2029; --ink:#b8bdc6; --ink2:#959ca8; --ink3:#666e7c; --line:#262c36;
  --pos:#3fb36d; --neg:#f0605a; --accent:#4c8dff; --dep:#d9a23a; --hover:#212732;
  --grid:#1e232c; --grid2:#1a1f27; --axis:#2b313c; --zero:#3a414e; --cross:#6f7888; --tagbg:#9aa1ad; --tagfg:#0e1116;
  --fillpos:rgba(63,179,109,.13); --fillneg:rgba(240,96,90,.12); --grip:#2e3440;
  --shadow:none; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#f9fafb; --ink:#15181d; --ink2:#4a5260; --ink3:#8a93a3; --line:#e3e6eb;
  --pos:#1f8a4c; --neg:#c8372d; --accent:#2f6fde; --dep:#c98a12; --hover:#f0f2f5;
  --grid:#eef0f3; --grid2:#f3f4f6; --axis:#e3e6eb; --zero:#b8bfca; --cross:#9aa3b2; --tagbg:#15181d; --tagfg:#ffffff;
  --fillpos:rgba(31,138,76,.10); --fillneg:rgba(200,55,45,.10); --grip:#d5d9e0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
.wrap{max-width:1760px;margin:0 auto;padding:24px clamp(16px,2.5vw,40px) 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
header>div{min-width:0;flex:1 1 280px} header>div.right{flex:0 0 auto;display:flex;align-items:center;gap:12px}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere}
.meta{color:var(--ink2);font-size:13px;display:flex;flex-wrap:wrap;row-gap:2px}
.meta span{white-space:nowrap}
.meta span+span:before{content:"·";margin:0 8px;color:var(--ink3)}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:18px 22px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;text-align:left}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-bottom:2px}
.hero .sent{color:var(--ink2);font-size:15px;max-width:680px}
.hero .sent b{color:var(--ink)}
/* kutu grupları */
.groups{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 6px 12px;max-width:100%;width:fit-content}
.group .gt{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin:0 12px 6px;text-align:center}
.group .row{justify-content:center}
.group .row{display:flex;flex-wrap:wrap}
.card{padding:6px 18px 4px 20px;position:relative;min-width:200px;flex:0 1 auto}
.card+.card{border-left:1px solid var(--line)}
.card:before{content:"";position:absolute;left:5px;top:9px;width:4px;height:16px;border-radius:2px;background:var(--c,transparent)}
.card .t{font-size:12px;color:var(--ink2)}
.card .v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .s{font-size:11.5px;color:var(--ink3);margin-top:3px}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px 6px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink2);border-radius:8px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--ink3);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar .sp{flex:1}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;padding:2px 2px 8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);cursor:pointer;user-select:none;padding:2px 4px;border-radius:6px}
.chip:hover{background:var(--hover)}
.chip i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--c)}
.chip i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.chip.off{color:var(--ink3)} .chip.off i{opacity:.25}
.chip .val{color:var(--ink2);font-variant-numeric:tabular-nums;margin-left:2px}
.chip.off .val{display:none}
.ptitle{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;margin:2px 2px 4px}
canvas{display:block;width:100%;touch-action:none}
.info{font-size:12.5px;color:var(--ink);margin:-2px 2px 8px;min-height:19px;font-variant-numeric:tabular-nums}
.info .muted{color:var(--ink3)} .info .ev{margin-left:12px;color:var(--ink2)}
#charts:fullscreen{background:var(--bg);padding:14px 18px;overflow:auto}
#charts.fs{position:fixed;inset:0;z-index:30;background:var(--bg);padding:14px 18px;overflow:auto}
#charts:fullscreen .grip,#charts.fs .grip{display:none}
.grip{height:16px;margin:2px -14px -6px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
.grip span{width:46px;height:4px;border-radius:3px;background:var(--grip)}
.grip:hover span{background:var(--cross)}
.themebtn{border:1px solid var(--line);background:var(--panel2);color:var(--ink2);border-radius:8px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink3)}
footer{color:var(--ink3);font-size:11.5px;margin-top:16px;line-height:1.6}
/* şifre ekranı */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:40}
#lock form{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 28px 22px;width:min(380px,92vw)}
#lock h2{margin:0 0 6px;font-size:18px}
#lock p{margin:0 0 16px;color:var(--ink2);font-size:13px}
#lock input{width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:9px;font:inherit;font-size:15px}
#lock input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
#lock button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:9px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
#lock .err{color:var(--neg);font-size:12.5px;min-height:18px;margin-top:8px}
#app{display:none}
@media print{
  .toolbar,.grip,.themebtn{display:none!important}
  .box,.group,.hero{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<div id="lock" style="display:none">
  <form id="lockform" autocomplete="off">
    <h2>Rapor şifreli</h2>
    <p>Bu raporu görüntülemek için size iletilen şifreyi girin.</p>
    <input id="pw" type="password" placeholder="Şifre" autofocus>
    <button type="submit" id="pwbtn">Raporu Aç</button>
    <div class="err" id="pwerr"></div>
  </form>
</div>

<div id="app"><div class="wrap">
  <header>
    <div>
      <h1 id="title"></h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="right"><span class="meta" id="gen"></span><button class="themebtn" id="themeBtn"></button></div>
  </header>

  <div class="hero">
    <div><div class="lbl" id="heroLbl">Mevduata göre fark</div><div class="big" id="heroVal"></div></div>
    <div class="sent" id="heroSent"></div>
  </div>

  <div class="groups" id="cards"></div>

  <div id="charts">
  <div class="box">
    <div class="toolbar">
      <button class="btn" data-r="all">Tümü</button>
      <button class="btn" data-r="1m">1A</button>
      <button class="btn" data-r="3m">3A</button>
      <button class="btn" data-r="6m">6A</button>
      <button class="btn" data-r="ytd">YBB</button>
      <span class="sp"></span>
      <button class="btn" id="mkBtn">EFT işaretleri</button>
      <button class="btn" id="fsBtn" title="Tam ekran (Esc ile çık)">⛶ Tam ekran</button>
    </div>
    <div class="info" id="info"></div>
    <div class="ptitle">Değer (TL)</div>
    <div class="legend" id="legTop"></div>
    <canvas id="cTop" data-vh="0.78" data-min="520"></canvas>
    <div class="grip" data-for="cTop" title="Sürükleyerek grafiğin boyunu değiştirin · çift tık: varsayılan"><span></span></div>
  </div>
  <div class="box">
    <div class="ptitle">Kazanç bileşenleri (TL, görünen aralığın başından itibaren)</div>
    <div class="legend" id="legBot"></div>
    <canvas id="cBot" data-vh="0.58" data-min="400"></canvas>
    <div class="grip" data-for="cBot" title="Sürükleyerek grafiğin boyunu değiştirin · çift tık: varsayılan"><span></span></div>
  </div>
  </div>
  <footer id="foot"></footer>
</div></div>

<script>
"use strict";
(function(){
/* ── Yardımcılar ───────────────────────────────────────────────────────── */
const $=s=>document.querySelector(s);
const NF0=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
const NF1=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
const NF2=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=v=>v>0?"+":(v<0?"−":"");
const tl=v=>NF0.format(Math.round(Math.abs(v)))+" TL";
const tlS=v=>sg(v)+tl(v);
function compact(v){const a=Math.abs(v),s=v<0?"−":"";
  if(a>=1e9) return s+NF1.format(a/1e9)+" Mr"; if(a>=1e6) return s+NF1.format(a/1e6)+" Mn";
  if(a>=1e3) return s+NF0.format(a/1e3)+" B"; return s+NF0.format(a);}
const cls=v=>v>=0?"pos":"neg";
const pct=(v,d)=>sg(v)+"%"+(d===1?NF1:NF2).format(Math.abs(v));
function b64dec(s){const b=atob(s.replace(/\s+/g,""));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}

/* ── Şifre çözme: PBKDF2-SHA256 → (şifreleme anahtarı, MAC anahtarı); HMAC-SHA256 sayaç akışı + HMAC etiketi ── */
async function decrypt(pass,enc,ct){
  const te=new TextEncoder(), subtle=crypto.subtle;
  const salt=b64dec(enc.salt), nonce=b64dec(enc.nonce), tag=b64dec(enc.tag);
  const base=await subtle.importKey("raw",te.encode(pass),"PBKDF2",false,["deriveBits"]);
  const km=new Uint8Array(await subtle.deriveBits({name:"PBKDF2",salt,iterations:enc.iter,hash:"SHA-256"},base,512));
  const hk=raw=>subtle.importKey("raw",raw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const encK=await hk(km.slice(0,32)), macK=await hk(km.slice(32));
  const macIn=new Uint8Array(salt.length+nonce.length+ct.length); macIn.set(salt,0); macIn.set(nonce,salt.length); macIn.set(ct,salt.length+nonce.length);
  const mac=new Uint8Array(await subtle.sign("HMAC",macK,macIn));
  let diff=mac.length^tag.length; for(let i=0;i<mac.length&&i<tag.length;i++) diff|=mac[i]^tag[i];
  if(diff) throw new Error("bad");
  const nb=Math.ceil(ct.length/32), jobs=[];
  for(let i=0;i<nb;i++){const blk=new Uint8Array(20); blk.set(nonce,0); new DataView(blk.buffer).setUint32(16,i,false); jobs.push(subtle.sign("HMAC",encK,blk));}
  const ks=await Promise.all(jobs); const out=new Uint8Array(ct.length);
  for(let i=0;i<nb;i++){const k=new Uint8Array(ks[i]); for(let j=0;j<32&&i*32+j<ct.length;j++) out[i*32+j]=ct[i*32+j]^k[j];}
  return new TextDecoder().decode(out);
}

/* ── Başlat ─────────────────────────────────────────────────────────────── */
const enc=JSON.parse($("#enc").textContent||"null");
const raw=b64dec($("#payload").textContent);
if(enc){
  $("#lock").style.display="flex";
  if(!window.crypto||!crypto.subtle){$("#pwerr").textContent="Bu tarayıcı şifreli raporları açamıyor. Güncel bir Chrome, Edge veya Firefox kullanın.";}
  $("#lockform").addEventListener("submit",async e=>{
    e.preventDefault(); $("#pwerr").textContent=""; $("#pwbtn").textContent="Açılıyor…";
    try{ const txt=await decrypt($("#pw").value,enc,raw); $("#lock").style.display="none"; start(JSON.parse(txt)); }
    catch(err){ $("#pwerr").textContent="Şifre hatalı."; $("#pwbtn").textContent="Raporu Aç"; $("#pw").select(); }
  });
}else{ start(JSON.parse(new TextDecoder().decode(raw))); }

/* ── Rapor ──────────────────────────────────────────────────────────────── */
function start(D){
  $("#app").style.display="block";
  document.title=D.meta.title;
  $("#title").textContent=D.meta.title;
  $("#meta").innerHTML=D.meta.lines.map(x=>"<span>"+x+"</span>").join("");
  $("#gen").textContent="Oluşturuldu: "+D.meta.generated;
  $("#foot").innerHTML=D.meta.notes.join("<br>");
  const dates=D.dates.map(s=>new Date(s+"T00:00:00")), N=dates.length;
  const S={}; D.series.forEach(s=>S[s.id]=s);
  const A=D.aux;
  let i0=0,i1=N-1,hover=-1,showMk=!!D.markers.length;
  const fmtD=d=>d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric"});

  /* aralık bazlı değerler */
  const rel=(arr)=>arr.map(v=>v-arr[i0]);                     // seçili aralığın başından itibaren
  function dietz(vals,flows,a,b){                              // Modified Dietz + ÷365 bazında yıllık
    const days=b-a; if(days<1) return null;
    let net=0,base=vals[a]; for(let i=a+1;i<=b;i++){net+=flows[i]; base+=flows[i]*(b-i)/days;}
    const gain=vals[b]-vals[a]-net; if(base<=0) return {gain,days,pct:null,ann:null};
    const p=gain/base*100; const ann=p>-100?(Math.pow(1+p/100,1/days)-1)*365*100:null;
    return {gain,days,pct:p,ann};
  }
  function seriesData(s){ return s.rel? rel(s.data): s.data; }

  /* tema */
  const DARKMAP={"#2f6fde":"#4c8dff","#c98a12":"#d9a23a","#e0b44a":"#e8c160","#8a93a3":"#8b95a7","#1f8a4c":"#3fb36d",
                 "#c8372d":"#f0605a","#7c5cd6":"#a084f5","#14a3a3":"#2cc4c4","#0f766e":"#2bb3a6"};
  let T={};
  function readTheme(){ const cs=getComputedStyle(document.documentElement), g=k=>cs.getPropertyValue(k).trim();
    T={dark:document.documentElement.dataset.theme!=="light",grid:g("--grid"),grid2:g("--grid2"),axis:g("--axis"),zero:g("--zero"),
       text:g("--ink3"),cross:g("--cross"),tagbg:g("--tagbg"),tagfg:g("--tagfg"),panel:g("--panel"),ink:g("--ink"),
       fp:g("--fillpos"),fn:g("--fillneg"),pos:g("--pos"),neg:g("--neg")}; }
  const col=s=>s.color==="ink"?T.ink:(T.dark&&DARKMAP[s.color]?DARKMAP[s.color]:s.color);
  readTheme();
  function syncThemeBtn(){ $("#themeBtn").textContent=T.dark?"☀ Açık tema":"☾ Koyu tema"; }
  $("#themeBtn").onclick=()=>{ const nt=T.dark?"light":"dark"; document.documentElement.dataset.theme=nt;
    try{localStorage.setItem("rapor_tema",nt);}catch(e){}
    readTheme(); syncThemeBtn(); renderLegends(); renderCards(); draw(); };
  syncThemeBtn();

  /* kutular (gruplar hâlinde, sadece bilgi) */
  function cardsModel(){
    const fl=A.flow, P=S.port.data, Dp=S.dep.data;
    const rP=dietz(P,fl,i0,i1), rD=dietz(Dp,fl,i0,i1);
    const gainP=rP?rP.gain:0, gainD=rD?rD.gain:0, fark=gainP-gainD;
    const sub=r=>r&&r.pct!=null?(r.days+" günde "+pct(r.pct,2)+(r.ann!=null?"  ·  yıllık "+pct(r.ann,1):"")):"";
    $("#heroVal").innerHTML='<span class="'+cls(fark)+'">'+tlS(fark)+"</span>";
    $("#heroLbl").textContent="Mevduata göre "+(fark>=0?"önde":"geride");
    $("#heroSent").innerHTML=fmtD(dates[Math.min(i0+1,i1)])+" – "+fmtD(dates[i1])+" arasında "+D.meta.port_name.toLowerCase()+" <b>"+tlS(gainP)+"</b> kazandırdı"+
      (rP&&rP.ann!=null?" (yıllık "+pct(rP.ann,1)+")":"")+"; aynı para mevduatta olsaydı <b>"+tlS(gainD)+"</b> faiz getirirdi"+
      (rD&&rD.ann!=null?" (yıllık "+pct(rD.ann,1)+")":"")+".";
    const G1=[], G2=[], G3=[];
    G1.push({t:D.meta.port_name+" (son gün)",v:tl(P[i1]),c:"",line:"port",s:"başlangıçta "+tl(P[i0])});
    G1.push({t:"Gölge mevduat (son gün)",v:tl(Dp[i1]),c:"",line:"dep",s:"faiz "+tlS(gainD)});
    if(S.inv) G1.push({t:"Net yatırılan para",v:tl(S.inv.data[i1]),c:"",line:"inv",s:"başlangıç + net giriş/çıkış"});
    if(S.pnl){const v=S.pnl.data[i1]-S.pnl.data[i0]; G2.push({t:"Hisse PnL (gerçekleşen)",v:tlS(v),c:cls(v),line:"pnl",s:"aralıktaki satışların FIFO kâr/zararı"});}
    if(S.fe){const v=S.fe.data[i1]; G2.push({t:"Fiyat etkisi ("+fmtD(dates[i1])+")",v:tlS(v),c:cls(v),line:"fe",s:"açık hisseler · başlangıçta "+tlS(S.fe.data[i0])});}
    G2.push({t:"Mevduat getirisi (faiz)",v:tlS(gainD),c:"",line:"mf",s:sub(rD)});
    if(S.mfa){const v=S.mfa.data[i1]-S.mfa.data[i0]; G2.push({t:"Mevduat getirisi (bekleyen nakit hariç)",v:tlS(v),c:"",line:"mfa",s:"hisseye bağlı paranın faizi"});}
    G3.push({t:"Fark (değer − mevduat)",v:tlS(fark),c:cls(fark),line:"fark",s:"görünen aralıkta"});
    if(S.nv){const v=S.nv.data[i1]; G3.push({t:"Ekstre nakdi (son gün)",v:(v<0?"−":"")+tl(v),c:v<0?"neg":"",line:"nv",s:"valöre göre"});}
    return [{t:"Getiri bileşenleri",items:G2},{t:"Değer",items:G1},{t:"Sonuç",items:G3}].filter(g=>g.items.length);
  }
  function renderCards(){
    const el=$("#cards"); el.innerHTML="";
    cardsModel().forEach(gr=>{
      const g=document.createElement("div"); g.className="group";
      g.innerHTML='<div class="gt">'+gr.t+'</div><div class="row"></div>';
      const row=g.querySelector(".row");
      gr.items.forEach(c=>{ const d=document.createElement("div"); d.className="card";
        const s=c.line?S[c.line]:null; if(s) d.style.setProperty("--c",col(s));
        d.innerHTML='<div class="t">'+c.t+'</div><div class="v '+c.c+'">'+c.v+'</div>'+(c.s?'<div class="s">'+c.s+"</div>":"");
        row.appendChild(d); });
      el.appendChild(g);
    });
  }

  /* lejant */
  function renderLegends(){
    ["top","bot"].forEach(p=>{
      const el=$(p==="top"?"#legTop":"#legBot"); el.innerHTML="";
      D.series.filter(s=>s.panel===p).forEach(s=>{
        const c=document.createElement("span"); c.className="chip"+(s.visible?"":" off"); c.style.setProperty("--c",col(s)); c.dataset.id=s.id;
        c.innerHTML='<i class="'+(s.dash?"dash":"")+'"></i>'+s.name+' <span class="val"></span>'; c.title="Tıkla: göster/gizle · Çift tıkla: sadece bu";
        c.onclick=()=>{s.visible=!s.visible; renderLegends(); renderCards(); draw();};
        c.ondblclick=()=>{D.series.filter(x=>x.panel===p).forEach(x=>x.visible=(x===s)); renderLegends(); renderCards(); draw();};
        el.appendChild(c);
      });
    });
    if(typeof updateLegendValues==="function"&&typeof v0!=="undefined") updateLegendValues();
  }
  function syncMk(){ $("#mkBtn").classList.toggle("on",showMk); }
  $("#mkBtn").onclick=()=>{showMk=!showMk; syncMk(); renderCards(); draw();};
  if(!D.markers.length) $("#mkBtn").style.display="none";

  /* ── Görünüm (TradingView mantığı): kesirli gün aralığı v0..v1 ─────────── */
  let v0=0, v1=N-1;
  const MINSPAN=Math.min(7,N-1);
  function clampView(){ let span=Math.max(MINSPAN,Math.min(N-1,v1-v0));
    if(v0<0){v0=0;} if(v0+span>N-1){v0=N-1-span;} v1=v0+span; }
  function syncIdx(){ i0=Math.max(0,Math.min(N-2,Math.round(v0))); i1=Math.max(i0+1,Math.min(N-1,Math.round(v1))); }
  let rafCards=0;
  function viewChanged(fromBtn){ clampView(); syncIdx();
    if(!fromBtn) document.querySelectorAll(".toolbar .btn[data-r]").forEach(x=>x.classList.remove("on"));
    if(!rafCards) rafCards=requestAnimationFrame(()=>{rafCards=0; renderCards();});
    updateInfo(); updateLegendValues(); draw(); }
  function setRange(a,b,fromBtn){ v0=a; v1=b; viewChanged(fromBtn); }
  const idxOf=d=>{let k=0; while(k<N-1&&dates[k]<d) k++; return k;};
  document.querySelectorAll(".toolbar .btn[data-r]").forEach(b=>b.onclick=()=>{
    const r=b.dataset.r, last=dates[N-1]; let a=0;
    const back=m=>{const d=new Date(last); d.setMonth(d.getMonth()-m); return Math.max(0,idxOf(d)-1);};
    if(r==="1m") a=back(1); if(r==="3m") a=back(3); if(r==="6m") a=back(6);
    if(r==="ytd") a=Math.max(0,idxOf(new Date(last.getFullYear(),0,1))-1);
    document.querySelectorAll(".toolbar .btn[data-r]").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    setRange(a,N-1,true); });

  /* bilgi satırı ve lejant değerleri */
  let hoverP=null, hoverY=null;
  function updateInfo(){
    const el=$("#info");
    if(hover>=0){ const ev=(A.events&&A.events[hover])||[];
      el.innerHTML="<b>"+fmtD(dates[hover])+"</b>"+(ev.length?ev.map(x=>' <span class="ev">'+x[0]+" <span class=\""+cls(x[1])+"\">"+tlS(x[1])+"</span></span>").join(""):' <span class="muted">işlem yok</span>');
    } else {
      el.innerHTML='<b>'+fmtD(dates[Math.min(i0+1,i1)])+" – "+fmtD(dates[i1])+'</b> <span class="muted">· Sürükle: kaydır · Tekerlek: yakınlaş/uzaklaş · Shift + sürükle: aralık seç · Çift tık: tümü</span>';
    }
  }
  function updateLegendValues(){
    const at=hover>=0?hover:i1;
    document.querySelectorAll(".chip[data-id]").forEach(c=>{ const s=S[c.dataset.id]; const v=seriesData(s)[at];
      c.querySelector(".val").textContent=s.panel==="bot"?tlS(v):((v<0?"−":"")+tl(v)); });
  }

  /* ── Grafik ──────────────────────────────────────────────────────────── */
  const cv={top:$("#cTop"),bot:$("#cBot")}, geo={}, charts=$("#charts");
  const M={l:10,r:92,t:12,b:30};
  const isFS=()=>document.fullscreenElement===charts||charts.classList.contains("fs");
  function niceStep(span,n){const raw=span/Math.max(n,1); const mag=Math.pow(10,Math.floor(Math.log10(raw||1)));
    for(const m of [1,2,2.5,5,10]) if(raw<=m*mag) return m*mag; return 10*mag;}
  function size(c){const dpr=window.devicePixelRatio||1, w=c.clientWidth;
    let h=c.dataset.px?+c.dataset.px:Math.max(+c.dataset.min,Math.round(window.innerHeight*(+c.dataset.vh)));
    if(isFS()){ const avail=Math.max(400,window.innerHeight-250); h=Math.round(avail*(c.id==="cTop"?0.62:0.38)); }
    if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); c.style.height=h+"px";}
    const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); return {g,w,h};}
  function tag(g,x,y,txt,bg,fg,align){ g.font="600 11.5px -apple-system,Segoe UI,Roboto,Arial,sans-serif";
    const tw=g.measureText(txt).width+12, th=18; let bx=align==="center"?x-tw/2:x;
    g.fillStyle=bg; if(g.roundRect){g.beginPath(); g.roundRect(bx,y-th/2,tw,th,4); g.fill();} else g.fillRect(bx,y-th/2,tw,th);
    g.fillStyle=fg; g.textAlign="left"; g.textBaseline="middle"; g.fillText(txt,bx+6,y+0.5); }
  function drawPanel(p){
    const c=cv[p], {g,w,h}=size(c); g.clearRect(0,0,w,h);
    const vis=D.series.filter(s=>s.panel===p&&s.visible);
    const pw=w-M.l-M.r, ph=h-M.t-M.b, span=v1-v0;
    const X=i=>M.l+(i-v0)/span*pw;
    const a=Math.max(0,Math.floor(v0)), b=Math.min(N-1,Math.ceil(v1));
    let lo=Infinity,hi=-Infinity;
    const datas=vis.map(s=>{const d=seriesData(s); for(let i=a;i<=b;i++){const v=d[i]; if(v<lo)lo=v; if(v>hi)hi=v;} return d;});
    if(p==="bot"){lo=Math.min(lo,0); hi=Math.max(hi,0);}
    if(!isFinite(lo)){lo=0;hi=1;}
    if(hi-lo<1){hi+=1; lo-=1;}
    const pad=(hi-lo)*0.07; const allPos=lo>=0; lo-=pad; hi+=pad; if(p==="top"&&allPos&&lo<0) lo=0;
    const Y=v=>M.t+ph-(v-lo)/(hi-lo)*ph, Yinv=y=>lo+(M.t+ph-y)/ph*(hi-lo);
    geo[p]={X,Y,Yinv,pw,ph,w,h};
    // ızgara + sağ değer ekseni
    g.font="11.5px -apple-system,Segoe UI,Roboto,Arial,sans-serif"; g.textBaseline="middle";
    const st=niceStep(hi-lo,Math.max(3,Math.round(ph/70)));
    for(let v=Math.ceil(lo/st)*st; v<=hi; v+=st){const y=Y(v);
      g.strokeStyle=Math.abs(v)<st/1e6?T.zero:T.grid; g.lineWidth=1; g.beginPath(); g.moveTo(M.l,y); g.lineTo(w-M.r,y); g.stroke();
      g.fillStyle=T.text; g.textAlign="left"; g.fillText(compact(v),w-M.r+8,y);}
    g.strokeStyle=T.axis; g.beginPath(); g.moveTo(w-M.r+.5,M.t); g.lineTo(w-M.r+.5,M.t+ph); g.stroke();
    // x etiketleri
    g.textBaseline="top"; const nt=Math.max(2,Math.min(10,Math.floor(pw/130)));
    for(let k=0;k<nt;k++){const i=Math.round(v0+k*span/(nt-1)); if(i<0||i>N-1) continue; const x=X(i);
      g.strokeStyle=T.grid2; g.beginPath(); g.moveTo(x,M.t); g.lineTo(x,M.t+ph); g.stroke();
      g.fillStyle=T.text; g.textAlign=k===0?"left":(k===nt-1?"right":"center"); g.fillText(fmtD(dates[i]),x,h-M.b+8);}
    g.save(); g.beginPath(); g.rect(M.l,M.t,pw,ph); g.clip();
    // değer ve mevduat arası boyama
    if(p==="top"&&S.port.visible&&S.dep.visible){
      const A1=S.port.data,B1=S.dep.data;
      // aynı işaretli ardışık günleri tek çokgen olarak doldur (dikiş çizgisi olmasın)
      let k0=a;
      while(k0<b){ const up=(A1[k0]+A1[k0+1])>=(B1[k0]+B1[k0+1]); let k1=k0+1;
        while(k1<b&&((A1[k1]+A1[k1+1])>=(B1[k1]+B1[k1+1]))===up) k1++;
        g.fillStyle=up?T.fp:T.fn; g.beginPath(); g.moveTo(X(k0),Y(A1[k0]));
        for(let i=k0+1;i<=k1;i++) g.lineTo(X(i),Y(A1[i]));
        for(let i=k1;i>=k0;i--) g.lineTo(X(i),Y(B1[i]));
        g.closePath(); g.fill(); k0=k1; }
    }
    // EFT işaretleri
    if(p==="top"&&showMk){ D.markers.forEach(m=>{ if(m.i<a||m.i>b) return; const x=X(m.i), y=M.t+ph;
      g.fillStyle=m.v>0?T.pos:T.neg; g.beginPath();
      if(m.v>0){g.moveTo(x,y-11); g.lineTo(x-5,y-2); g.lineTo(x+5,y-2);} else {g.moveTo(x,y-2); g.lineTo(x-5,y-11); g.lineTo(x+5,y-11);}
      g.closePath(); g.fill(); g.strokeStyle=m.v>0?"rgba(31,138,76,.25)":"rgba(200,55,45,.25)"; g.setLineDash([3,4]); g.beginPath(); g.moveTo(x,M.t); g.lineTo(x,y-12); g.stroke(); g.setLineDash([]); }); }
    // çizgiler
    vis.forEach((s,k)=>{ const d=datas[k]; g.strokeStyle=col(s); g.lineWidth=s.w||2; g.setLineDash(s.dash?[6,4]:[]); g.lineJoin="round";
      g.beginPath(); for(let i=a;i<=b;i++){const x=X(i),y=Y(d[i]); i===a?g.moveTo(x,y):g.lineTo(x,y);} g.stroke(); g.setLineDash([]); });
    // seçim (Shift + sürükle)
    if(drag&&drag.mode==="sel"&&drag.p===p&&drag.x1!=null){ g.fillStyle="rgba(47,111,222,.10)"; const xa=Math.min(drag.x0,drag.x1), xb=Math.max(drag.x0,drag.x1); g.fillRect(xa,M.t,xb-xa,ph); }
    // artı imleç
    if(hover>=a&&hover<=b){ const x=X(hover); g.strokeStyle=T.cross; g.lineWidth=1; g.setLineDash([4,4]);
      g.beginPath(); g.moveTo(x,M.t); g.lineTo(x,M.t+ph); g.stroke();
      if(hoverP===p&&hoverY!=null&&hoverY>=M.t&&hoverY<=M.t+ph){ g.beginPath(); g.moveTo(M.l,hoverY); g.lineTo(w-M.r,hoverY); g.stroke(); }
      g.setLineDash([]);
      vis.forEach((s,k)=>{const y=Y(datas[k][hover]); g.fillStyle=T.panel; g.strokeStyle=col(s); g.lineWidth=2; g.beginPath(); g.arc(x,y,3.5,0,7); g.fill(); g.stroke();}); }
    g.restore();
    // son değer etiketleri (sağ eksen)
    const last=hover>=a&&hover<=b?hover:b;
    const labs=vis.map((s,k)=>({s,v:datas[k][last],y:Y(datas[k][last])})).filter(o=>o.y>=M.t-4&&o.y<=M.t+ph+4).sort((p1,p2)=>p1.y-p2.y);
    for(let k=1;k<labs.length;k++) if(labs[k].y-labs[k-1].y<19) labs[k].y=labs[k-1].y+19;
    labs.forEach(o=>tag(g,w-M.r+2,o.y,compact(o.v),col(o.s),T.dark?"#0e1116":"#fff","left"));
    // imleç etiketleri: değer (sağ) ve tarih (alt)
    if(hover>=a&&hover<=b){
      if(hoverP===p&&hoverY!=null&&hoverY>=M.t&&hoverY<=M.t+ph) tag(g,w-M.r+2,hoverY,compact(Yinv(hoverY)),T.tagbg,T.tagfg,"left");
      g.fillStyle=T.panel; g.fillRect(M.l,h-M.b+2,pw,M.b-2);
      tag(g,Math.max(M.l+40,Math.min(w-M.r-40,X(hover))),h-M.b+16,fmtD(dates[hover]),T.tagbg,T.tagfg,"center");
    }
  }
  function draw(){ drawPanel("top"); drawPanel("bot"); }

  /* ── Etkileşim: sürükle = kaydır, tekerlek = yakınlaş, Shift+sürükle = seç, iki parmak = yakınlaş ── */
  let drag=null; const ptrs=new Map(); let pinch=null;
  const fracAt=(p,x)=>{const G=geo[p]; return G?Math.max(0,Math.min(1,(x-M.l)/G.pw)):0;};
  const idxAt=(p,x)=>Math.max(0,Math.min(N-1,Math.round(v0+fracAt(p,x)*(v1-v0))));
  function zoomAt(p,x,factor){ const f=fracAt(p,x), c=v0+f*(v1-v0); let span=Math.max(MINSPAN,Math.min(N-1,(v1-v0)*factor));
    v0=c-f*span; v1=v0+span; viewChanged(); }
  ["top","bot"].forEach(p=>{ const c=cv[p];
    c.style.cursor="crosshair";
    c.addEventListener("pointerdown",e=>{ ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY}); c.setPointerCapture(e.pointerId);
      if(ptrs.size===2){ const [q1,q2]=[...ptrs.values()]; pinch={p,d:Math.abs(q1.x-q2.x)||1,v0,v1,mid:(q1.x+q2.x)/2}; drag=null; return; }
      drag=e.shiftKey?{mode:"sel",p,x0:e.offsetX,x1:null}:{mode:"pan",p,x0:e.offsetX,v0s:v0,v1s:v1,moved:false};
      if(drag.mode==="pan") c.style.cursor="grabbing"; });
    c.addEventListener("pointermove",e=>{ const x=e.offsetX;
      if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x,y:e.offsetY});
      if(pinch&&ptrs.size===2){ const [q1,q2]=[...ptrs.values()]; const d=Math.abs(q1.x-q2.x)||1; const G=geo[p];
        const f=Math.max(0,Math.min(1,(pinch.mid-M.l)/G.pw)), cIdx=pinch.v0+f*(pinch.v1-pinch.v0);
        const span=Math.max(MINSPAN,Math.min(N-1,(pinch.v1-pinch.v0)*pinch.d/d)); v0=cIdx-f*span; v1=v0+span; viewChanged(); return; }
      if(drag&&drag.mode==="pan"&&drag.p===p){ const G=geo[p]; const dx=x-drag.x0; if(Math.abs(dx)>2) drag.moved=true;
        const sh=-dx/G.pw*(drag.v1s-drag.v0s); v0=drag.v0s+sh; v1=drag.v1s+sh; hover=-1; viewChanged(); return; }
      if(drag&&drag.mode==="sel"&&drag.p===p){ drag.x1=Math.max(M.l,Math.min(geo[p].w-M.r,x)); }
      hover=idxAt(p,x); hoverP=p; hoverY=e.offsetY; updateInfo(); updateLegendValues(); draw(); });
    const end=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; c.style.cursor="crosshair";
      if(drag&&drag.mode==="sel"&&drag.x1!=null&&Math.abs(drag.x1-drag.x0)>6){ const A2=idxAt(p,Math.min(drag.x0,drag.x1)), B2=idxAt(p,Math.max(drag.x0,drag.x1)); drag=null; if(B2>A2) setRange(A2,B2); else draw(); }
      else { drag=null; draw(); } };
    c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end);
    c.addEventListener("pointerleave",()=>{ if(drag) return; hover=-1; hoverP=null; hoverY=null; updateInfo(); updateLegendValues(); draw(); });
    c.addEventListener("wheel",e=>{ e.preventDefault(); const dy=e.deltaMode===1?e.deltaY*30:e.deltaY;
      if(Math.abs(e.deltaX)>Math.abs(dy)){ const G=geo[p]; const sh=e.deltaX/G.pw*(v1-v0); v0+=sh; v1+=sh; viewChanged(); return; }
      zoomAt(p,e.offsetX,Math.exp(dy*0.0015)); },{passive:false});
    c.addEventListener("dblclick",()=>setRange(0,N-1));
  });
  // klavye: ← → kaydır, + − yakınlaş (grafik alanı üzerindeyken)
  window.addEventListener("keydown",e=>{ if(hoverP==null&&!isFS()) return; if(e.target&&e.target.tagName==="INPUT") return;
    const span=v1-v0;
    if(e.key==="ArrowLeft"){v0-=span*0.1; v1-=span*0.1; viewChanged(); e.preventDefault();}
    else if(e.key==="ArrowRight"){v0+=span*0.1; v1+=span*0.1; viewChanged(); e.preventDefault();}
    else if(e.key==="+"||e.key==="="){const c=(v0+v1)/2, s=Math.max(MINSPAN,span/1.25); v0=c-s/2; v1=c+s/2; viewChanged();}
    else if(e.key==="-"){const c=(v0+v1)/2, s=Math.min(N-1,span*1.25); v0=c-s/2; v1=c+s/2; viewChanged();}
    else if(e.key==="Escape"&&charts.classList.contains("fs")){toggleFS();} });
  window.addEventListener("resize",draw);

  /* tam ekran */
  function toggleFS(){
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    if(charts.classList.contains("fs")){ charts.classList.remove("fs"); document.body.style.overflow=""; afterFS(); return; }
    if(charts.requestFullscreen){ charts.requestFullscreen().catch(()=>{ charts.classList.add("fs"); document.body.style.overflow="hidden"; afterFS(); }); }
    else { charts.classList.add("fs"); document.body.style.overflow="hidden"; afterFS(); }
  }
  function afterFS(){ $("#fsBtn").textContent=isFS()?"✕ Tam ekrandan çık":"⛶ Tam ekran"; $("#fsBtn").classList.toggle("on",isFS()); setTimeout(draw,30); }
  $("#fsBtn").onclick=toggleFS;
  document.addEventListener("fullscreenchange",afterFS);

  // grafik boyu: tutamaçla sürükle, tercih bu tarayıcıda saklanır
  const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, LSset=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
  document.querySelectorAll(".grip").forEach(gr=>{ const c=document.getElementById(gr.dataset.for), key="rapor_boy_"+c.id;
    const saved=LS(key); if(saved&&+saved>=200) c.dataset.px=saved;
    let y0=null,h0=0;
    gr.addEventListener("pointerdown",e=>{y0=e.clientY; h0=c.getBoundingClientRect().height; gr.setPointerCapture(e.pointerId); e.preventDefault();});
    gr.addEventListener("pointermove",e=>{ if(y0==null) return; c.dataset.px=Math.round(Math.max(200,Math.min(2400,h0+e.clientY-y0))); draw(); });
    gr.addEventListener("pointerup",()=>{ if(y0!=null){y0=null; LSset(key,c.dataset.px);} });
    gr.addEventListener("dblclick",()=>{ delete c.dataset.px; LSset(key,null); draw(); });
  });

  renderLegends(); syncMk(); $('.toolbar .btn[data-r="all"]').classList.add("on"); setRange(0,N-1,true);
}
})();
</script>
</body>
</html>
